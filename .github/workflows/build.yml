name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # nanopb's generator (run by CMake) needs protobuf.
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          pip install protobuf grpcio-tools

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/**') }}

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Name the files
        run: |
          mkdir out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Tarjim-Phone.apk
          # The native libraries, so the Kotlin side can be built on Windows without the NDK step.
          (cd android/app/build/intermediates/merged_native_libs/debug/mergeDebugNativeLibs/out/lib && zip -r "$GITHUB_WORKSPACE/out/native-libs.zip" arm64-v8a)

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: out/

      - name: Publish as the latest build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/Tarjim-Phone.apk out/native-libs.zip \
            --title "آخر نسخة" --notes "تُبنى تلقائياً من آخر تعديل: ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
